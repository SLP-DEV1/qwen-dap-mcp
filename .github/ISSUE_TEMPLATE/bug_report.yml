name: Bug report
description: Report a reproducible debugger, MCP, packaging, policy, or runtime-analysis problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets, private source, sensitive dump contents, and identifying local paths before posting logs.
  - type: input
    id: version
    attributes:
      label: qwen-dap-mcp version
      placeholder: v0.17.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / architecture
      placeholder: Windows 11 x64 or Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x or 22.x
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: DAP adapter / version
      placeholder: CodeLLDB 1.12.x, lldb-dap 18+, or GDB 14+
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Live launch
        - Local PID attach
        - Remote gdbserver / lldb-server attach
        - Crash dump / core / minidump
        - Crash diagnosis / autonomous verification
        - Hang / deadlock triage
        - Multi-session routing
        - Differential compare_runs
        - Writer tracing / trace_value / find_writer
        - HOL Guard / DAP policy
        - Packaging / installation / publishing
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest reliable sequence that reproduces the problem, including session IDs when multi-session behavior matters.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / debugger evidence
      description: Include relevant stderr output, DAP evidence, symbol-health limitations, or workflow output. Remove secrets and private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, confidential source, sensitive dump data, and identifying local paths.
          required: true
        - label: Any live/remote target in this report is a target I am authorized to debug.
          required: true
