name: Multi-Session Remote Linux Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/adapters/gdb-dap.ts'
      - 'src/adapters/lldb-dap.ts'
      - 'src/dap/**'
      - 'src/remote-endpoint.ts'
      - 'src/tools/register-gdb-dap-tools.ts'
      - 'src/tools/register-lldb-dap-tools.ts'
      - 'src/tools/register-session-tools.ts'
      - 'src/tools/session-routing.ts'
      - 'test/multi-session-remote-real-smoke.ts'
      - 'test/fixtures/gdb-dap-smoke.cpp'
      - 'test/fixtures/native-smoke.cpp'
      - '.github/workflows/multi-session-remote-linux.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/adapters/gdb-dap.ts'
      - 'src/adapters/lldb-dap.ts'
      - 'src/dap/**'
      - 'src/remote-endpoint.ts'
      - 'src/tools/register-gdb-dap-tools.ts'
      - 'src/tools/register-lldb-dap-tools.ts'
      - 'src/tools/register-session-tools.ts'
      - 'src/tools/session-routing.ts'
      - 'test/multi-session-remote-real-smoke.ts'
      - 'test/fixtures/gdb-dap-smoke.cpp'
      - 'test/fixtures/native-smoke.cpp'
      - '.github/workflows/multi-session-remote-linux.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install native debugger toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb gdbserver g++ lldb
          gdb --version

      - name: Locate lldb-dap and lldb-server
        shell: bash
        run: |
          adapter="$(command -v lldb-dap || true)"
          if [ -z "$adapter" ]; then
            adapter="$(find /usr/lib -maxdepth 4 -type f -name 'lldb-dap' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          server="$(command -v lldb-server || true)"
          if [ -z "$server" ]; then
            server="$(find /usr/lib -maxdepth 4 -type f -name 'lldb-server' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$adapter"
          test -x "$adapter"
          test -n "$server"
          test -x "$server"
          echo "LLDB_DAP_PATH=$adapter" >> "$GITHUB_ENV"
          echo "LLDB_SERVER_PATH=$server" >> "$GITHUB_ENV"
          echo "Installed lldb-dap: $adapter"
          echo "Installed lldb-server: $server"

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Build project and native fixtures
        run: |
          npm run build
          mkdir -p build/multi-session
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/gdb-dap-smoke.cpp -o build/multi-session/gdb-smoke
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/native-smoke.cpp -o build/multi-session/lldb-smoke

      - name: Run concurrent GDB and LLDB remote-session smoke
        run: |
          env -u QWEN_DAP_MCP_REMOTE_DEBUG_HOSTS npx tsx test/multi-session-remote-real-smoke.ts \
            --gdb "$(command -v gdb)" \
            --gdbserver "$(command -v gdbserver)" \
            --lldb-dap "$LLDB_DAP_PATH" \
            --lldb-server "$LLDB_SERVER_PATH" \
            --gdb-program build/multi-session/gdb-smoke \
            --gdb-source test/fixtures/gdb-dap-smoke.cpp \
            --lldb-program build/multi-session/lldb-smoke \
            --lldb-source test/fixtures/native-smoke.cpp
