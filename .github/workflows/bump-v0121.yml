name: Bump v0.12.1 metadata

on:
  push:
    branches:
      - hardening/v0.12.1

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/v0.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Bump all release metadata
        shell: bash
        run: |
          npm version 0.12.1 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['qwen-extension.json', 'server.json']) {
            const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
            doc.version = '0.12.1';
            if (path === 'server.json') {
              for (const pkg of doc.packages ?? []) {
                if (pkg.registryType === 'npm' && pkg.identifier === '@slp-dev1/qwen-dap-mcp') pkg.version = '0.12.1';
              }
            }
            fs.writeFileSync(path, `${JSON.stringify(doc, null, 2)}\n`);
          }
          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = '## Unreleased\n\n### Changed / hardened\n';
          if (!changelog.includes(marker)) throw new Error('Unreleased changelog section not found');
          changelog = changelog.replace(marker, '## Unreleased\n\n## 0.12.1 - 2026-08-26\n\n### Changed / hardened\n');
          fs.writeFileSync('CHANGELOG.md', changelog);
          NODE
          npm ci --ignore-scripts
          npm run check
      - name: Commit version metadata
        shell: bash
        run: |
          git add package.json package-lock.json qwen-extension.json server.json CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: bump version to 0.12.1'
          git push origin HEAD:hardening/v0.12.1
