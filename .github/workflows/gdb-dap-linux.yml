name: GDB DAP Linux Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/adapters/gdb-dap.ts'
      - 'src/dap/**'
      - 'src/tools/agent-diagnostics.ts'
      - 'src/tools/find-writer.ts'
      - 'src/tools/register-dump-tools.ts'
      - 'src/tools/register-gdb-dap-tools.ts'
      - 'test/gdb-dap-*.ts'
      - 'test/find-writer.test.ts'
      - 'test/fixtures/gdb-dap-smoke.cpp'
      - '.github/workflows/gdb-dap-linux.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/adapters/gdb-dap.ts'
      - 'src/dap/**'
      - 'src/tools/agent-diagnostics.ts'
      - 'src/tools/find-writer.ts'
      - 'src/tools/register-dump-tools.ts'
      - 'src/tools/register-gdb-dap-tools.ts'
      - 'test/gdb-dap-*.ts'
      - 'test/find-writer.test.ts'
      - 'test/fixtures/gdb-dap-smoke.cpp'
      - '.github/workflows/gdb-dap-linux.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install distribution GDB
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb g++
          gdb --version

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Build project and native fixture
        run: |
          npm run build
          mkdir -p build/gdb-dap-smoke
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/gdb-dap-smoke.cpp -o build/gdb-dap-smoke/gdb-dap-smoke

      - name: Run real GDB DAP watchpoint smoke through auto-discovery
        run: |
          env -u GDB_DAP_PATH -u GDB_PATH -u GDB_HOME npx tsx test/gdb-dap-real-smoke.ts \
            --program build/gdb-dap-smoke/gdb-dap-smoke \
            --source test/fixtures/gdb-dap-smoke.cpp
