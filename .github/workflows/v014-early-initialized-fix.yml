name: v0.14 early initialized fix

on:
  push:
    branches:
      - feature/v0.14-gdb-find-writer
    paths:
      - .github/workflows/v014-early-initialized-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.14-gdb-find-writer
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply lifecycle fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/dap/connection.ts',
              """  waitForEvent(\n    eventName: string,\n    timeoutMs = 15_000,\n    predicate?: (event: DebugProtocol.Event) => boolean,\n  ): Promise<DebugProtocol.Event> {""",
              """  waitForEvent(\n    eventName: string,\n    timeoutMs = 15_000,\n    predicate?: (event: DebugProtocol.Event) => boolean,\n    includeRecent = false,\n  ): Promise<DebugProtocol.Event> {""",
          )
          replace(
              'src/dap/connection.ts',
              """      this.on(eventKey, handler);\n      this.on('adapterExit', onAdapterExit);\n      this.on('adapterError', onAdapterError);\n    });\n  }""",
              """      this.on(eventKey, handler);\n      this.on('adapterExit', onAdapterExit);\n      this.on('adapterError', onAdapterError);\n\n      // Some valid DAP adapters (notably GNU GDB) emit `initialized`\n      // immediately after the initialize response, before launch/attach.\n      // Register the live listener first, then inspect this transport's\n      // bounded event history so an event cannot race between the two.\n      if (includeRecent) {\n        const recent = [...this.eventHistory].reverse().find((record) => {\n          if (record.event !== eventName) return false;\n          const candidate = {\n            seq: 0,\n            type: 'event' as const,\n            event: record.event,\n            ...(record.body === undefined ? {} : { body: record.body }),\n          } satisfies DebugProtocol.Event;\n          return !predicate || predicate(candidate);\n        });\n        if (recent) {\n          handler({\n            seq: 0,\n            type: 'event',\n            event: recent.event,\n            ...(recent.body === undefined ? {} : { body: recent.body }),\n          });\n        }\n      }\n    });\n  }""",
          )
          replace(
              'src/dap/session.ts',
              """    const initializedEvent = this.connection.waitForEvent('initialized', debugRequestTimeoutMs);""",
              """    const initializedEvent = this.connection.waitForEvent('initialized', debugRequestTimeoutMs, undefined, true);""",
          )
          replace(
              'test/fixtures/mock-dap-adapter.mjs',
              """      response(request, {\n        supportsConfigurationDoneRequest: true,""",
              """      response(request, {\n        supportsConfigurationDoneRequest: true,""",
          )
          replace(
              'test/fixtures/mock-dap-adapter.mjs',
              """        ],\n      });\n      break;\n    case 'launch':""",
              """        ],\n      });\n      if (process.env.MOCK_INITIALIZED_ON_INITIALIZE === '1') event('initialized');\n      break;\n    case 'launch':""",
          )
          replace(
              'test/fixtures/mock-dap-adapter.mjs',
              """      launchRequest = request;\n      event('initialized');\n      break;""",
              """      launchRequest = request;\n      if (process.env.MOCK_INITIALIZED_ON_INITIALIZE !== '1') event('initialized');\n      break;""",
          )
          marker = """test('failed launch aligns initialized timeout, observes the parallel request, and clears stale session state', async (t) => {"""
          addition = """test('launch accepts initialized emitted immediately after initialize', async (t) => {\n  const session = new DapSession();\n  t.after(async () => session.reset());\n\n  await session.start({\n    ...mockStartOptions(),\n    env: { MOCK_INITIALIZED_ON_INITIALIZE: '1' },\n  });\n  assert.ok(\n    session.snapshot().recentEvents.some((event) => event.event === 'initialized'),\n    'mock adapter should emit initialized before launch',\n  );\n\n  const launch = await session.launch(\n    { program: '/tmp/early-initialized-app' },\n    [{ source: '/tmp/main.cpp', lines: [42] }],\n  );\n  assert.equal((launch as { request: string }).request, 'launch');\n  assert.equal(session.snapshot().configured, true);\n  assert.equal(session.snapshot().activeRequest, 'launch');\n});\n\n"""
          replace('test/dap-session.test.ts', marker, addition + marker)
          PY
      - name: Validate full project
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Commit validated fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v014-early-initialized-fix.yml
          git add src/dap/connection.ts src/dap/session.ts test/dap-session.test.ts test/fixtures/mock-dap-adapter.mjs
          git commit -m "fix: support DAP adapters that initialize before launch"
          git push origin HEAD:feature/v0.14-gdb-find-writer
