name: Apply MCP tool quality metadata

on:
  push:
    branches:
      - improve/glama-tool-quality

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/glama-tool-quality
          fetch-depth: 0

      - name: Improve agent tool metadata
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name}: expected exactly one match, found {count}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          patch('src/tools/register-debug-tools.ts', [
              (
                  "import { DapSession } from '../dap/session.js';\n",
                  "import { DapSession } from '../dap/session.js';\nimport {\n  DEBUG_SESSION_CONTROL_ANNOTATIONS,\n  READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n  SESSION_TEARDOWN_ANNOTATIONS,\n} from './tool-annotations.js';\n",
              ),
              (
                  "      description: 'Continue a paused thread and optionally wait for the next stopped event.',\n      inputSchema: z.object({\n        threadId: z.number().int().positive(),\n        waitForStop: z.boolean().default(true),\n        timeoutMs: z.number().int().min(1000).max(120000).default(15000),\n      }),",
                  "      description: 'Resume one paused thread in a live debug session. Use this after inspecting a stopped state when execution should proceed to the next stop or termination; do not use it for crash dumps because postmortem targets cannot resume. This changes debuggee execution state and may allow the target to perform normal application side effects before the next stop.',\n      annotations: DEBUG_SESSION_CONTROL_ANNOTATIONS,\n      inputSchema: z.object({\n        threadId: z.number().int().positive().describe('DAP thread identifier to resume; obtain it from debug_snapshot, debug_status, or a stopped event.'),\n        waitForStop: z.boolean().default(true).describe('When true, wait for the next stopped event before returning; when false, return after the continue request is accepted.'),\n        timeoutMs: z.number().int().min(1000).max(120000).default(15000).describe('Maximum time in milliseconds to wait for the next stopped event when waitForStop is true.'),\n      }),",
              ),
              (
                  "      description: 'Capture one bounded agent-friendly runtime snapshot: stop reason, thread, stack, top frame, scopes, locals/arguments, registers, and optional best-effort disassembly/modules/exception info.',\n      inputSchema: z.object({\n        threadId: z.number().int().positive().optional(),\n        stackLevels: z.number().int().positive().max(100).default(12),\n        maxVariablesPerScope: z.number().int().positive().max(500).default(100),\n        includeDisassembly: z.boolean().default(true),\n        disassembleBefore: z.number().int().nonnegative().max(100).default(8),\n        disassembleAfter: z.number().int().nonnegative().max(100).default(12),\n        includeModules: z.boolean().default(false),\n        moduleCount: z.number().int().positive().max(500).default(50),\n        includeExceptionInfo: z.boolean().default(true),\n      }),",
                  "      description: 'Capture bounded evidence from the current stopped debug state without resuming execution. Use this when an agent needs raw stack, locals, registers, exception details, modules, or nearby instructions; prefer debug_diagnose_stop when you also want ranked crash hypotheses and project-frame selection. This is read-only with respect to the debuggee and returns best-effort evidence plus collection errors for optional data that an adapter cannot provide.',\n      annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n      inputSchema: z.object({\n        threadId: z.number().int().positive().optional().describe('Stopped DAP thread to inspect; omit to use the session-selected stopped thread.'),\n        stackLevels: z.number().int().positive().max(100).default(12).describe('Maximum number of stack frames to include, from the selected thread top downward.'),\n        maxVariablesPerScope: z.number().int().positive().max(500).default(100).describe('Maximum variables returned per inspected scope, bounding output size.'),\n        includeDisassembly: z.boolean().default(true).describe('Include best-effort instructions around the selected frame instruction pointer when supported.'),\n        disassembleBefore: z.number().int().nonnegative().max(100).default(8).describe('Number of instructions before the current instruction to request when disassembly is enabled.'),\n        disassembleAfter: z.number().int().nonnegative().max(100).default(12).describe('Number of instructions after the current instruction to request when disassembly is enabled.'),\n        includeModules: z.boolean().default(false).describe('Include a bounded list of loaded executable images and libraries.'),\n        moduleCount: z.number().int().positive().max(500).default(50).describe('Maximum loaded modules to return when includeModules is true.'),\n        includeExceptionInfo: z.boolean().default(true).describe('Include structured exception information for the stopped thread when the adapter supports it.'),\n      }),",
              ),
              (
                  "  server.registerTool('debug_status', { title: 'Debug Session Status', description: 'Return current adapter/session state plus recent DAP events and adapter stderr.' }, async () => result(session.snapshot()));",
                  "  server.registerTool('debug_status', {\n    title: 'Debug Session Status',\n    description: 'Inspect debugger lifecycle state, the selected stop, recent DAP events, and bounded adapter stderr without changing target execution. Use this to determine whether a session is initialized, running, stopped, postmortem, exited, or failed before choosing another debug tool; it is diagnostic only and does not resume, launch, attach, or terminate the debuggee.',\n    annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n  }, async () => result(session.snapshot()));",
              ),
              (
                  "    { title: 'Disconnect Debugger', description: 'Disconnect the active DAP session and stop the adapter process.', inputSchema: z.object({ terminateDebuggee: z.boolean().default(true) }) },",
                  "    {\n      title: 'Disconnect Debugger',\n      description: 'End the active DAP session and stop its local adapter process. Use this when debugging is finished or the session must be reset; do not call it when more runtime evidence is still needed. With terminateDebuggee=true it may also terminate a live target process, so this operation can destroy the current runtime state and cannot be treated as read-only.',\n      annotations: SESSION_TEARDOWN_ANNOTATIONS,\n      inputSchema: z.object({\n        terminateDebuggee: z.boolean().default(true).describe('Whether the debugger should terminate the live debuggee while disconnecting; set false to request detach/preserve behavior when the adapter supports it.'),\n      }),\n    },",
              ),
          ])

          patch('src/tools/register-dump-tools.ts', [
              (
                  "import { logger } from '../logger.js';\n",
                  "import { logger } from '../logger.js';\nimport { READ_ONLY_LOCAL_TOOL_ANNOTATIONS } from './tool-annotations.js';\n",
              ),
              (
                  "      description:\n        'Open a local native core/minidump with CodeLLDB for read-only postmortem analysis. No target process is launched or attached. Returns an initial bounded debug snapshot.',\n      inputSchema: z.object({\n        dumpPath: z.string().min(1),\n        program: z.string().min(1).optional(),\n        sourceMap: z.record(z.string(), z.string()).optional(),\n        adapterPath: z.string().min(1).optional(),\n        cwd: z.string().optional(),\n        requestTimeoutMs: z.number().int().min(1000).max(120000).default(30000),\n        threadId: z.number().int().positive().optional(),\n        stackLevels: z.number().int().positive().max(100).default(20),\n        maxVariablesPerScope: z.number().int().positive().max(500).default(100),\n        includeDisassembly: z.boolean().default(true),\n        includeModules: z.boolean().default(true),\n        moduleCount: z.number().int().positive().max(500).default(100),\n      }),",
                  "      description:\n        'Open a local native core/minidump with CodeLLDB and capture bounded postmortem evidence. Use this when the failure is already recorded and no target process should execute; use debug_run_to_stop or debug_this_crash mode=codelldb for a live reproduction instead. The tool starts only the local debugger adapter, never launches or resumes the crashed program, treats the dump as read-only, and returns the initial stack/locals/registers plus optional modules and disassembly.',\n      annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n      inputSchema: z.object({\n        dumpPath: z.string().min(1).describe('Absolute or local path to the native core/minidump file to inspect.'),\n        program: z.string().min(1).optional().describe('Optional path to the matching executable image, used by CodeLLDB to improve symbol/module resolution.'),\n        sourceMap: z.record(z.string(), z.string()).optional().describe('Optional mapping from source paths recorded in symbols to local source paths.'),\n        adapterPath: z.string().min(1).optional().describe('Optional explicit CodeLLDB executable path; omit to use normal CodeLLDB discovery.'),\n        cwd: z.string().optional().describe('Working directory for the local CodeLLDB adapter process; this does not execute the crashed target.'),\n        requestTimeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Per-request DAP timeout in milliseconds while opening and inspecting the dump.'),\n        threadId: z.number().int().positive().optional().describe('Specific dump thread to inspect; omit to use the debugger-selected stopped/crashed thread.'),\n        stackLevels: z.number().int().positive().max(100).default(20).describe('Maximum stack frames to include in the initial postmortem snapshot.'),\n        maxVariablesPerScope: z.number().int().positive().max(500).default(100).describe('Maximum variables returned per scope in the initial snapshot.'),\n        includeDisassembly: z.boolean().default(true).describe('Include best-effort instructions around the selected crash frame.'),\n        includeModules: z.boolean().default(true).describe('Include loaded executable images and libraries recorded in the dump.'),\n        moduleCount: z.number().int().positive().max(500).default(100).describe('Maximum number of modules to include when includeModules is true.'),\n      }),",
              ),
          ])

          patch('src/tools/run-to-stop.ts', [
              (
                  "import type {\n  RuntimeSnapshot,\n  RuntimeSnapshotOptions,\n  SourceBreakpointGroup,\n} from '../dap/session.js';\n",
                  "import type {\n  RuntimeSnapshot,\n  RuntimeSnapshotOptions,\n  SourceBreakpointGroup,\n} from '../dap/session.js';\nimport { LOCAL_TARGET_EXECUTION_ANNOTATIONS } from './tool-annotations.js';\n",
              ),
              (
                  "const jsonRecord = z.record(z.string(), z.unknown());\nconst breakpointGroupSchema = z.object({\n  source: z.string().min(1).describe('Absolute or adapter-resolvable source file path'),\n  lines: z.array(z.number().int().positive()).min(1),\n});\nconst snapshotSchema = z.object({\n  threadId: z.number().int().positive().optional(),\n  stackLevels: z.number().int().positive().max(100).optional(),\n  maxVariablesPerScope: z.number().int().positive().max(500).optional(),\n  includeDisassembly: z.boolean().optional(),\n  disassembleBefore: z.number().int().nonnegative().max(100).optional(),\n  disassembleAfter: z.number().int().nonnegative().max(100).optional(),\n  includeModules: z.boolean().optional(),\n  moduleCount: z.number().int().positive().max(500).optional(),\n  includeExceptionInfo: z.boolean().optional(),\n});",
                  "const jsonRecord = z.record(z.string(), z.unknown()).describe('Adapter-specific DAP launch or attach configuration.');\nconst breakpointGroupSchema = z.object({\n  source: z.string().min(1).describe('Absolute or adapter-resolvable source file path.'),\n  lines: z.array(z.number().int().positive()).min(1).describe('One or more 1-based source line numbers to replace as breakpoints for this source file.'),\n}).describe('Source file and line breakpoints applied before configuration completes.');\nconst snapshotSchema = z.object({\n  threadId: z.number().int().positive().optional().describe('Stopped thread to snapshot; omit to use the thread from the stopped event.'),\n  stackLevels: z.number().int().positive().max(100).optional().describe('Maximum stack frames to collect after a stop.'),\n  maxVariablesPerScope: z.number().int().positive().max(500).optional().describe('Maximum variables to return per inspected scope.'),\n  includeDisassembly: z.boolean().optional().describe('Whether to include best-effort disassembly near the selected frame.'),\n  disassembleBefore: z.number().int().nonnegative().max(100).optional().describe('Instructions before the selected instruction to request.'),\n  disassembleAfter: z.number().int().nonnegative().max(100).optional().describe('Instructions after the selected instruction to request.'),\n  includeModules: z.boolean().optional().describe('Whether to include a bounded loaded-module list.'),\n  moduleCount: z.number().int().positive().max(500).optional().describe('Maximum loaded modules to include.'),\n  includeExceptionInfo: z.boolean().optional().describe('Whether to request structured exception information after a stop.'),\n}).describe('Optional bounds and evidence categories for the snapshot captured only when execution stops.');",
              ),
              (
                  "      description: 'Launch or attach through an initialized live DAP session, configure optional source breakpoints, wait race-safely for stopped/exited/terminated, and return a bounded runtime snapshot when execution stops.',\n      inputSchema: z.object({\n        request: z.enum(['launch', 'attach']).default('launch'),\n        configuration: jsonRecord,\n        breakpoints: z.array(breakpointGroupSchema).optional(),\n        timeoutMs: z.number().int().min(1000).max(120000).default(30000),\n        snapshot: snapshotSchema.optional(),\n      }),",
                  "      description: 'Run one live launch or attach through an already initialized DAP adapter until the first stopped, exited, or terminated event. Use this when you need deterministic runtime evidence from a reproduction; do not use it for a postmortem dump or when executing/attaching to the local target is not authorized. Launch mode executes application code and attach mode changes debugger control of an existing process, so normal target side effects may occur before the stop. Returns the request result, terminal/stopped outcome, session status, and a bounded snapshot only when a stopped event is captured.',\n      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,\n      inputSchema: z.object({\n        request: z.enum(['launch', 'attach']).default('launch').describe('Choose launch to start a new target from configuration, or attach to connect to an existing authorized local target.'),\n        configuration: jsonRecord,\n        breakpoints: z.array(breakpointGroupSchema).optional().describe('Optional source breakpoint groups configured before the debugger completes launch/attach setup.'),\n        timeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Maximum milliseconds to wait for the first stopped, exited, or terminated event.'),\n        snapshot: snapshotSchema.optional(),\n      }),",
              ),
          ])

          patch('src/tools/agent-diagnostics.ts', [
              (
                  "import { runToStop } from './run-to-stop.js';\n",
                  "import { runToStop } from './run-to-stop.js';\nimport { LOCAL_TARGET_EXECUTION_ANNOTATIONS, READ_ONLY_LOCAL_TOOL_ANNOTATIONS } from './tool-annotations.js';\n",
              ),
              (
                  "const jsonRecord = z.record(z.string(), z.unknown());\nconst breakpointGroupSchema = z.object({\n  source: z.string().min(1).describe('Absolute or adapter-resolvable source file path'),\n  lines: z.array(z.number().int().positive()).min(1),\n});\nconst snapshotSchema = z.object({\n  threadId: z.number().int().positive().optional(),\n  stackLevels: z.number().int().positive().max(100).default(20),\n  maxVariablesPerScope: z.number().int().positive().max(500).default(100),\n  includeDisassembly: z.boolean().default(true),\n  disassembleBefore: z.number().int().nonnegative().max(100).default(8),\n  disassembleAfter: z.number().int().nonnegative().max(100).default(12),\n  includeModules: z.boolean().default(true),\n  moduleCount: z.number().int().positive().max(500).default(100),\n  includeExceptionInfo: z.boolean().default(true),\n});\nconst analysisSchema = z.object({\n  projectRoots: z.array(z.string().min(1)).max(20).optional(),\n  projectModules: z.array(z.string().min(1)).max(50).optional(),\n  callerDepth: z.number().int().nonnegative().max(8).default(3),\n});",
                  "const jsonRecord = z.record(z.string(), z.unknown()).describe('Adapter-specific DAP launch or attach configuration object.');\nconst breakpointGroupSchema = z.object({\n  source: z.string().min(1).describe('Absolute or adapter-resolvable source file path.'),\n  lines: z.array(z.number().int().positive()).min(1).describe('One or more 1-based source line numbers to replace as breakpoints for this source file.'),\n}).describe('Source file and line breakpoints configured before a live reproduction runs.');\nconst snapshotSchema = z.object({\n  threadId: z.number().int().positive().optional().describe('Stopped DAP thread to inspect; omit to use the session-selected stopped thread.'),\n  stackLevels: z.number().int().positive().max(100).default(20).describe('Maximum number of stack frames to inspect when collecting crash evidence.'),\n  maxVariablesPerScope: z.number().int().positive().max(500).default(100).describe('Maximum variables returned per inspected scope, bounding evidence size.'),\n  includeDisassembly: z.boolean().default(true).describe('Include best-effort disassembly around the selected instruction pointer when supported.'),\n  disassembleBefore: z.number().int().nonnegative().max(100).default(8).describe('Number of instructions before the selected instruction to request.'),\n  disassembleAfter: z.number().int().nonnegative().max(100).default(12).describe('Number of instructions after the selected instruction to request.'),\n  includeModules: z.boolean().default(true).describe('Include a bounded list of loaded executable images and libraries.'),\n  moduleCount: z.number().int().positive().max(500).default(100).describe('Maximum loaded modules to include when module collection is enabled.'),\n  includeExceptionInfo: z.boolean().default(true).describe('Request structured exception information for the stopped thread when supported.'),\n}).describe('Bounds and optional evidence categories for a runtime crash snapshot.');\nconst analysisSchema = z.object({\n  projectRoots: z.array(z.string().min(1)).max(20).optional().describe('Optional local source-root paths used to recognize project-controlled stack frames.'),\n  projectModules: z.array(z.string().min(1)).max(50).optional().describe('Optional executable or library names treated as project-controlled modules during frame selection.'),\n  callerDepth: z.number().int().nonnegative().max(8).default(3).describe('How many project-controlled caller frames beyond the selected frame to inspect for provenance and root cause.'),\n}).describe('Hints used to distinguish project code from runtime, system, or third-party frames.');",
              ),
              (
                  "const workflowSchema = z.object({\n  stage: z.enum(['diagnose', 'verify', 'autonomous']).default('diagnose'),\n  baseline: verificationBaselineSchema.optional(),\n  agentState: autonomousAgentStateSchema.optional(),\n  maxIterations: z.number().int().positive().max(10).default(3),\n});",
                  "const workflowSchema = z.object({\n  stage: z.enum(['diagnose', 'verify', 'autonomous']).default('diagnose').describe('diagnose creates initial evidence; verify compares against a prior verification baseline; autonomous advances the bounded agent state machine.'),\n  baseline: verificationBaselineSchema.optional().describe('Verification baseline returned by an earlier diagnosis; required when stage=verify.'),\n  agentState: autonomousAgentStateSchema.optional().describe('Opaque autonomous state returned by the previous autonomous call; pass it back unchanged to continue the bounded cycle.'),\n  maxIterations: z.number().int().positive().max(10).default(3).describe('Maximum autonomous fix/reproduce iterations allowed when starting stage=autonomous.'),\n}).describe('Controls one-shot diagnosis, explicit verification, or the bounded autonomous crash workflow.');",
              ),
              (
                  "      description:\n        'Capture the current stopped state and produce an agent-friendly diagnosis with crash classification, automatic project-frame selection, operand/register/variable bindings, call-chain provenance, ranked hypotheses, and a fix/rebuild/reproduce/verify plan.',\n      inputSchema: snapshotSchema.extend({ analysis: analysisSchema.optional() }),",
                  "      description:\n        'Diagnose an already stopped live or postmortem debug session without changing execution state. Use this when a debugger has captured the failure and you want project-frame selection, crash classification, operand/register/variable bindings, call-chain provenance, ranked hypotheses, and a fix/rebuild/reproduce/verify plan; use debug_snapshot instead when only raw evidence is needed. The tool is read-only and returns both the bounded snapshot and the derived diagnosis, including collection limitations when optional debugger evidence is unavailable.',\n      annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n      inputSchema: snapshotSchema.extend({ analysis: analysisSchema.optional() }),",
              ),
              (
                  "      description:\n        'Select the first likely project-controlled frame, return both raw fault-frame and selected project-frame source/disassembly correlations, and bind project-frame instruction operands back to registers and pointer-like locals when possible.',\n      inputSchema: z.object({\n        threadId: z.number().int().positive().optional(),\n        stackLevels: z.number().int().positive().max(100).default(12),\n        disassembleBefore: z.number().int().nonnegative().max(100).default(8),\n        disassembleAfter: z.number().int().nonnegative().max(100).default(12),\n        analysis: analysisSchema.optional(),\n      }),",
                  "      description:\n        'Correlate source locations, disassembly, registers, and pointer-like locals for the raw fault frame and the first likely project-controlled frame. Use this for low-level root-cause evidence when a crash is already stopped and instruction/operand provenance matters; prefer debug_diagnose_stop for a broader ranked diagnosis. This is read-only, does not resume the target, and returns frame-selection reasoning, both correlations, operand bindings, and any best-effort collection errors.',\n      annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,\n      inputSchema: z.object({\n        threadId: z.number().int().positive().optional().describe('Stopped DAP thread to inspect; omit to use the session-selected stopped thread.'),\n        stackLevels: z.number().int().positive().max(100).default(12).describe('Maximum stack frames considered while selecting the project-controlled frame.'),\n        disassembleBefore: z.number().int().nonnegative().max(100).default(8).describe('Instructions before the selected instruction included in each disassembly window.'),\n        disassembleAfter: z.number().int().nonnegative().max(100).default(12).describe('Instructions after the selected instruction included in each disassembly window.'),\n        analysis: analysisSchema.optional(),\n      }),",
              ),
              (
                  "      description:\n        'High-level debugging-agent workflow. Diagnose the current stop, run an initialized DAP session, auto-start CodeLLDB for a local native program, or open a crash dump. workflow.stage=\"autonomous\" adds a bounded serialized agent loop with formal action dependencies, runtime root-cause backtracking, verification quality scoring, crash fingerprints, changed-failure re-baselining, and deterministic fixed/blocked/budget-exhausted stop conditions.',\n      inputSchema: z.object({\n        mode: z.enum(['current', 'live', 'codelldb', 'dump']).default('current'),\n        request: z.enum(['launch', 'attach']).default('launch'),\n        configuration: jsonRecord.optional(),\n        breakpoints: z.array(breakpointGroupSchema).optional(),\n        timeoutMs: z.number().int().min(1000).max(120000).default(30000),\n        program: z.string().min(1).optional(),\n        args: z.array(z.string()).optional(),\n        cwd: z.string().optional(),\n        env: z.record(z.string(), z.string()).optional(),\n        stopOnEntry: z.boolean().default(false),\n        adapterPath: z.string().min(1).optional(),\n        requestTimeoutMs: z.number().int().min(1000).max(120000).default(30000),\n        dumpPath: z.string().min(1).optional(),\n        sourceMap: z.record(z.string(), z.string()).optional(),\n        snapshot: snapshotSchema.optional(),\n        analysis: analysisSchema.optional(),\n        workflow: workflowSchema.optional(),\n      }),",
                  "      description:\n        'Preferred high-level native crash workflow. Use mode=current for an already stopped session, dump for read-only postmortem analysis, codelldb to discover CodeLLDB and launch a local binary, or live with an already initialized generic DAP adapter. Do not use codelldb/live when executing or attaching to the target is not authorized: those modes can run application code and cause its normal side effects, while current/dump only inspect stopped evidence. workflow.stage selects initial diagnosis, verification against a prior baseline, or the bounded autonomous cycle. Returns runtime evidence, diagnosis, verification/autonomous metadata, and debugger status with deterministic fixed/blocked/budget-exhausted outcomes where applicable.',\n      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,\n      inputSchema: z.object({\n        mode: z.enum(['current', 'live', 'codelldb', 'dump']).default('current').describe('current inspects an existing stop; live runs launch/attach through an initialized DAP session; codelldb starts CodeLLDB and launches program; dump opens a frozen core/minidump.'),\n        request: z.enum(['launch', 'attach']).default('launch').describe('For mode=live, choose whether the initialized DAP adapter launches a target or attaches to an existing authorized target.'),\n        configuration: jsonRecord.optional().describe('Required for mode=live: adapter-specific DAP launch/attach configuration.'),\n        breakpoints: z.array(breakpointGroupSchema).optional().describe('Optional source breakpoints configured before a live/codelldb reproduction completes setup.'),\n        timeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Maximum milliseconds to wait for the reproduction to stop, exit, or terminate.'),\n        program: z.string().min(1).optional().describe('Required for mode=codelldb; optional for dump symbol resolution. Local path to the native executable.'),\n        args: z.array(z.string()).optional().describe('Command-line arguments passed to the launched program in mode=codelldb.'),\n        cwd: z.string().optional().describe('Working directory for CodeLLDB/target launch and a project-root hint for diagnosis.'),\n        env: z.record(z.string(), z.string()).optional().describe('Environment variables supplied to the launched program in mode=codelldb.'),\n        stopOnEntry: z.boolean().default(false).describe('When true in mode=codelldb, request an initial debugger stop at program entry before normal execution.'),\n        adapterPath: z.string().min(1).optional().describe('Optional explicit CodeLLDB executable path for codelldb/dump modes; omit to auto-discover it.'),\n        requestTimeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Per-request DAP timeout in milliseconds for CodeLLDB operations.'),\n        dumpPath: z.string().min(1).optional().describe('Required for mode=dump: local path to the native core/minidump file.'),\n        sourceMap: z.record(z.string(), z.string()).optional().describe('For mode=dump, map source paths stored in debug symbols to local source paths.'),\n        snapshot: snapshotSchema.optional(),\n        analysis: analysisSchema.optional(),\n        workflow: workflowSchema.optional(),\n      }),",
              ),
          ])

      - name: Remove temporary workflow and commit metadata
        shell: bash
        run: |
          rm .github/workflows/apply-tool-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools .github/workflows/apply-tool-quality.yml
          git commit -m "feat: improve MCP agent tool metadata"
          git push origin HEAD:improve/glama-tool-quality
