name: CodeLLDB Windows Dump Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/dap/**'
      - 'src/diagnostics/**'
      - 'src/adapters/codelldb-dump.ts'
      - 'src/adapters/codelldb.ts'
      - 'src/tools/agent-diagnostics.ts'
      - 'src/tools/register-dump-tools.ts'
      - 'src/server.ts'
      - 'test/codelldb-dump-profile.test.ts'
      - 'test/codelldb-real-dump-smoke.ts'
      - 'test/fixtures/native-dump.cpp'
      - '.github/workflows/codelldb-windows-dump.yml'
      - 'package.json'
      - 'qwen-extension.json'

jobs:
  real-codelldb-dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and unit test bridge
        run: npm run check

      - name: Build native crash fixture with PDB symbols
        shell: pwsh
        run: |
          cl /nologo /EHsc /Zi /Od /std:c++17 /Fe:test\fixtures\native-dump.exe test\fixtures\native-dump.cpp /link /DEBUG:FULL dbghelp.lib

      - name: Generate Windows minidump
        shell: pwsh
        run: |
          Remove-Item native-dump.dmp -ErrorAction SilentlyContinue
          & .\test\fixtures\native-dump.exe
          $crashExit = $LASTEXITCODE
          Write-Host "Crash fixture exit code: $crashExit"
          if (-not (Test-Path native-dump.dmp)) {
            throw 'native-dump.dmp was not generated'
          }
          $dump = Get-Item native-dump.dmp
          if ($dump.Length -lt 1024) {
            throw "Generated dump is unexpectedly small: $($dump.Length) bytes"
          }
          Write-Host "Generated minidump: $($dump.FullName) ($($dump.Length) bytes)"
          $global:LASTEXITCODE = 0

      - name: Download latest CodeLLDB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'qwen-dap-mcp-ci' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/vadimcn/codelldb/releases/latest'
          $asset = $release.assets | Where-Object {
            $_.name -match '^codelldb-(win32-x64|x86_64-windows)\.vsix$'
          } | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows x64 CodeLLDB VSIX found in latest release $($release.tag_name)"
          }
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile codelldb.vsix
          Copy-Item codelldb.vsix codelldb.zip
          Expand-Archive -Path codelldb.zip -DestinationPath .codelldb -Force
          $adapter = Get-ChildItem .codelldb -Recurse -Filter codelldb.exe |
            Where-Object { $_.FullName -match '[\\/]adapter[\\/]codelldb\.exe$' } |
            Select-Object -First 1
          if (-not $adapter) {
            throw 'codelldb.exe was not found inside the VSIX'
          }
          "CODELLDB_PATH=$($adapter.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using CodeLLDB $($release.tag_name): $($adapter.FullName)"

      - name: Inspect generated minidump through real DAP
        shell: pwsh
        run: |
          npx tsx test/codelldb-real-dump-smoke.ts `
            --adapter "$env:CODELLDB_PATH" `
            --program "$pwd\test\fixtures\native-dump.exe" `
            --dump "$pwd\native-dump.dmp" `
            --source "$pwd\test\fixtures\native-dump.cpp"
