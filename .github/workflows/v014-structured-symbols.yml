name: v0.14 structured outputs and symbol health

on:
  push:
    branches:
      - feature/v0.14-gdb-find-writer
    paths:
      - '.github/scripts/v014-structured-symbols.mjs'
      - '.github/workflows/v014-structured-symbols.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.14-gdb-find-writer
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply v0.14 structured-output and symbol-health patch
        run: node .github/scripts/v014-structured-symbols.mjs

      - name: Validate project
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Commit validated source changes
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "aufgeklebt@outlook.de"
          git add README.md src test
          git commit -m "feat: add structured agent outputs and symbol health"
          git push origin HEAD:feature/v0.14-gdb-find-writer
