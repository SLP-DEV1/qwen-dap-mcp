name: Cleanup merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale merged branches
        uses: actions/github-script@v9
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;

            if (context.eventName === 'push' && context.ref !== `refs/heads/${defaultBranch}`) {
              core.info(`Skipping non-default-branch push: ${context.ref}`);
              return;
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const openHeads = new Set(
              openPulls
                .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: defaultBranch,
              per_page: 100,
            });

            const latestMergedHead = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              if (pr.head.ref === defaultBranch) continue;

              const previous = latestMergedHead.get(pr.head.ref);
              if (!previous || Date.parse(pr.merged_at) > Date.parse(previous.merged_at)) {
                latestMergedHead.set(pr.head.ref, pr);
              }
            }

            async function currentBranch(branch) {
              try {
                const [ref, branchInfo] = await Promise.all([
                  github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }),
                  github.rest.repos.getBranch({ owner, repo, branch }),
                ]);
                return { sha: ref.data.object.sha, protected: branchInfo.data.protected };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function deleteExactBranch(branch, expectedSha, reason) {
              if (branch === defaultBranch) return;
              if (openHeads.has(branch)) {
                core.info(`Keeping ${branch}: it is used by an open pull request.`);
                return;
              }

              const current = await currentBranch(branch);
              if (!current) return;
              if (current.protected) {
                core.info(`Keeping ${branch}: branch is protected.`);
                return;
              }
              if (current.sha !== expectedSha) {
                core.info(`Keeping ${branch}: current SHA ${current.sha} differs from expected ${expectedSha}.`);
                return;
              }

              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              core.info(`Deleted ${branch}: ${reason}.`);
            }

            for (const [branch, pr] of latestMergedHead) {
              await deleteExactBranch(branch, pr.head.sha, `merged PR #${pr.number}`);
            }

            // Explicit stale branches from superseded development lines. Each
            // deletion is SHA-bound so a later branch reuse is never removed.
            const staleExactBranches = new Map([
              ['feat/v0.18-hardening-release', '7854cdf2afb7d761101794ba149e6c03b08226d6'],
              ['feat/hol-guard-hardening', '188e754a303f3d66480e1bb626bc6afef98e6bda'],
              ['feature/v0.12-agent-demo', '8118cebfd140bddec6a80c7775491d1dd588896b'],
              ['feat/managed-rr-replay', '10335025c69709f11756da3b6cbc681c67e0fed2'],
              ['chore/cleanup-stale-branches', 'ba51654865fcb9e48d4ff48e87096be1be813303'],
            ]);

            for (const [branch, expectedSha] of staleExactBranches) {
              await deleteExactBranch(branch, expectedSha, 'superseded exact-SHA development branch');
            }

            // Historical one-off branches are removed only when their current
            // commit is already a clean ancestor of the default branch.
            const legacyAncestorBranches = [
              'noop-check',
              'noop-temp',
              'tmp-do-not-use',
              'v0.6-release',
              'v0.7-dump',
            ];

            for (const branch of legacyAncestorBranches) {
              if (openHeads.has(branch)) continue;
              const current = await currentBranch(branch);
              if (!current || current.protected) continue;

              const comparison = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                owner,
                repo,
                basehead: `${branch}...${defaultBranch}`,
              });

              if (comparison.data.status !== 'ahead' || comparison.data.behind_by !== 0) {
                core.info(`Keeping ${branch}: it is not a clean ancestor of ${defaultBranch}.`);
                continue;
              }

              await deleteExactBranch(branch, current.sha, `verified ancestor of ${defaultBranch}`);
            }
