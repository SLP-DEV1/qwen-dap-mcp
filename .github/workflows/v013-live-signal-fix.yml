name: Apply v0.13 live signal classification fix

on:
  push:
    branches:
      - feature/v0.13-lldb-dap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.13-lldb-dap
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch live fatal-signal semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'src/diagnostics/analyze-snapshot.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldBlock = `function exceptionFatality(snapshot: RuntimeSnapshot): boolean | undefined {\n  const mode = snapshot.exception?.breakMode;\n  if (mode === 'unhandled' || mode === 'userUnhandled') return true;\n  // In a live session \`always\` commonly means a configured first-chance stop.\n  // A frozen postmortem snapshot cannot be continued to determine handling, so\n  // do not let that adapter break-mode downgrade a recognized crash family.\n  // Returning undefined keeps generic/unknown exceptions conservative while\n  // allowing explicit access-violation/SIGSEGV/etc. evidence to remain crash-likely.\n  if (snapshot.postmortem && (mode === 'always' || mode === 'never')) return undefined;\n  if (mode === 'always' || mode === 'never') return false;\n  return undefined;\n}`;
          const newBlock = `function exceptionFatality(snapshot: RuntimeSnapshot): boolean | undefined {\n  const mode = snapshot.exception?.breakMode;\n  if (mode === 'unhandled' || mode === 'userUnhandled') return true;\n\n  const exceptionText = collectText(snapshot.exception).join(' ').toLowerCase();\n  // Upstream lldb-dap reports synchronous POSIX crash signals through the DAP\n  // exception surface with breakMode=always. That value describes debugger\n  // stop policy, not whether SIGSEGV/SIGBUS/SIGILL/SIGFPE/SIGABRT is benign.\n  // Keep generic configured/first-chance exceptions conservative, but do not\n  // downgrade an explicit fatal-signal family merely because LLDB always stops\n  // when that signal is raised. crashLikely still means likely, not proven\n  // process termination; verification requires completing the reproduction.\n  if (/\\bsig(?:segv|bus|ill|fpe|abrt|stkflt)\\b/.test(exceptionText)) return true;\n\n  // A frozen postmortem snapshot cannot be continued to determine handling, so\n  // do not let adapter break-mode downgrade a recognized crash family there.\n  if (snapshot.postmortem && (mode === 'always' || mode === 'never')) return undefined;\n  if (mode === 'always' || mode === 'never') return false;\n  return undefined;\n}`;
          if (!source.includes(oldBlock)) throw new Error('exceptionFatality patch anchor changed');
          source = source.replace(oldBlock, newBlock);
          fs.writeFileSync(sourcePath, source);

          const testPath = 'test/diagnosis-hardening.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const anchor = `test('postmortem access violations stay crash-likely even when the adapter reports breakMode always', () => {`;
          const regression = `test('live lldb-dap SIGSEGV stays crash-likely even when breakMode is always', () => {\n  const snapshot = snapshotWithException('always');\n  snapshot.stopped = {\n    reason: 'exception',\n    description: 'signal SIGSEGV',\n    threadId: 1,\n    allThreadsStopped: true,\n  };\n  snapshot.exception = {\n    exceptionId: 'SIGSEGV',\n    description: 'Segmentation fault',\n    breakMode: 'always',\n  };\n\n  const diagnosis = analyzeRuntimeSnapshot(snapshot);\n\n  assert.equal(diagnosis.classification.category, 'segmentation-fault');\n  assert.equal(diagnosis.classification.crashLikely, true);\n  assert.equal(diagnosis.classification.confidence, 'high');\n});\n\n`;
          if (!test.includes(anchor)) throw new Error('diagnosis regression anchor changed');
          if (!test.includes("live lldb-dap SIGSEGV stays crash-likely")) {
            test = test.replace(anchor, regression + anchor);
          }
          fs.writeFileSync(testPath, test);
          NODE

          npm ci --ignore-scripts
          npm run check

      - name: Commit tested fix
        shell: bash
        run: |
          git add src/diagnostics/analyze-snapshot.ts test/diagnosis-hardening.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: classify live lldb-dap fatal signals'
          git push origin HEAD:feature/v0.13-lldb-dap
