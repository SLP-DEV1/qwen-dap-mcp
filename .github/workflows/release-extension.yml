name: Release Qwen Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

env:
  QWEN_CODE_SMOKE_VERSION: '0.22.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build, test and stage extension
        run: npm run check

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build self-contained extension archive
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          mkdir -p release
          tar -C release/extension -czf release/qwen-dap-mcp.tar.gz .
          test "$(tar -tzf release/qwen-dap-mcp.tar.gz | grep -Ec '^\./qwen-extension\.json$')" -eq 1
          if tar -tvzf release/qwen-dap-mcp.tar.gz | awk '$1 ~ /^[lh]/ { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'Archive unexpectedly contains a symbolic or hard link.' >&2
            exit 1
          fi
          sha256sum release/qwen-dap-mcp.tar.gz | tee release/qwen-dap-mcp.sha256.txt

      - name: Install Qwen Code for smoke tests
        run: npm install --global "@qwen-code/qwen-code@${QWEN_CODE_SMOKE_VERSION}"

      - name: Verify archive installs as a Qwen extension
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/qwen-extension-home"
          mkdir -p "$HOME"
          qwen --version
          qwen extensions install "$PWD/release/qwen-dap-mcp.tar.gz" --consent
          qwen extensions list | tee release/qwen-extensions-list.txt
          grep -F 'qwen-dap-mcp' release/qwen-extensions-list.txt
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const manifestPath = path.join(process.env.HOME, ".qwen", "extensions", "qwen-dap-mcp", "qwen-extension.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const expected = process.env.EXPECTED_VERSION;
            if (manifest.version !== expected) {
              throw new Error(`archive installed version ${manifest.version}, expected ${expected}`);
            }
          '
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release/qwen-dap-mcp.tar.gz#qwen-dap-mcp.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "qwen-dap-mcp ${{ steps.version.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release already exists
        if: steps.version.outputs.exists == 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; verifying it instead of publishing again."

      - name: Verify published release metadata
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          ACTUAL_TAG="$(jq -r '.tag_name' <<<"$RELEASE_JSON")"
          TARGET_COMMIT="$(jq -r '.target_commitish' <<<"$RELEASE_JSON")"
          IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.prerelease' <<<"$RELEASE_JSON")"

          test "$ACTUAL_TAG" = "$TAG"
          test "$IS_DRAFT" = 'false'
          test "$IS_PRERELEASE" = 'false'

          if [ "${{ steps.version.outputs.exists }}" = 'false' ]; then
            test "$TARGET_COMMIT" = "$GITHUB_SHA"
          else
            echo "Existing ${TAG} targets ${TARGET_COMMIT}; preserving historical release target."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published GitHub release installs exact version
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/qwen-published-release-home"
          mkdir -p "$HOME"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          qwen --version
          qwen extensions install SLP-DEV1/qwen-dap-mcp --consent
          qwen extensions list | tee "$RUNNER_TEMP/qwen-published-extensions-list.txt"

          grep -F "qwen-dap-mcp" "$RUNNER_TEMP/qwen-published-extensions-list.txt"
          grep -F "Qwen DAP MCP (${VERSION})" "$RUNNER_TEMP/qwen-published-extensions-list.txt"
          grep -F "Release tag: ${TAG}" "$RUNNER_TEMP/qwen-published-extensions-list.txt"

          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const manifestPath = path.join(process.env.HOME, ".qwen", "extensions", "qwen-dap-mcp", "qwen-extension.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const expected = process.env.EXPECTED_VERSION;
            if (manifest.version !== expected) {
              throw new Error(`published release installed version ${manifest.version}, expected ${expected}`);
            }
          '
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
