name: Apply scanner-safe Apache license metadata

on:
  push:
    branches: [fix/glama-license-detection]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/glama-license-detection
          fetch-depth: 0
      - name: Restore canonical Apache-2.0 text
        shell: python
        run: |
          from pathlib import Path
          p = Path('LICENSE')
          text = p.read_text(encoding='utf-8')
          old = '   Copyright [2026] [SLP-DEV1]'
          new = '   Copyright [yyyy] [name of copyright owner]'
          if old not in text:
              raise SystemExit('Expected customized Apache appendix line was not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('NOTICE').write_text('qwen-dap-mcp\nCopyright 2026 SLP-DEV1\n', encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-license-detection.yml
          git config user.name "SLP-DEV1"
          git config user.email "aufgeklebt@outlook.de"
          git add LICENSE NOTICE .github/workflows/fix-license-detection.yml
          git commit -m "fix: restore canonical Apache-2.0 license text"
          git push origin HEAD:fix/glama-license-detection
