name: v0.14 bootstrap

on:
  push:
    branches:
      - feature/v0.14-gdb-find-writer
    paths:
      - .github/workflows/v014-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.14-gdb-find-writer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.14 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              Path(path).write_text(content, encoding='utf-8')

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          write('src/adapters/gdb-dap.ts', r'''import { statSync } from 'node:fs';
import { dirname, join, resolve } from 'node:path';
import { spawnSync } from 'node:child_process';

import { DapError } from '../dap/errors.js';
import { resolveExistingDirectory, resolveExistingFile } from '../local-path.js';

export const MIN_GDB_DAP_MAJOR = 14;

export type GdbDapDiscoverySource = 'explicit' | 'environment' | 'home' | 'path';

export type GdbDapVersion = {
  major: number;
  minor?: number;
  raw: string;
};

export type GdbDapDiscoveryResult = {
  command: string;
  args: string[];
  source: GdbDapDiscoverySource;
  searched: string[];
  version: GdbDapVersion;
};

export type DiscoverGdbDapOptions = {
  explicitPath?: string;
  env?: NodeJS.ProcessEnv;
  allowPathFallback?: boolean;
};

export type GdbDapLaunchOptions = {
  program: string;
  args?: string[];
  cwd?: string;
  env?: Record<string, string>;
  stopOnEntry?: boolean;
  stopAtBeginningOfMainSubprogram?: boolean;
};

export type GdbDapPidAttachOptions = {
  pid: number;
  program?: string;
};

export type GdbDapRemoteAttachOptions = {
  target: string;
  program?: string;
};

export type GdbDapCoreOptions = {
  coreFile: string;
  program?: string;
};

function isFile(path: string): boolean {
  try {
    return statSync(path).isFile();
  } catch {
    return false;
  }
}

function executableNames(): string[] {
  if (process.platform === 'win32') return ['gdb.exe'];
  return ['gdb', 'gdb-19', 'gdb-18', 'gdb-17', 'gdb-16', 'gdb-15', 'gdb-14'];
}

function findOnPath(command: string): string | undefined {
  const locator = process.platform === 'win32' ? 'where.exe' : 'which';
  const result = spawnSync(locator, [command], {
    encoding: 'utf8',
    windowsHide: true,
    shell: false,
    timeout: 5_000,
    maxBuffer: 64 * 1024,
  });
  if (result.error || result.status !== 0 || !result.stdout) return undefined;
  const first = result.stdout.split(/\r?\n/).map((line) => line.trim()).find(Boolean);
  return first && isFile(first) ? first : undefined;
}

export function parseGdbVersion(output: string): GdbDapVersion | undefined {
  const firstLine = output.split(/\r?\n/).map((line) => line.trim()).find(Boolean) ?? '';
  const match = firstLine.match(/\b(?:GNU\s+)?gdb(?:\s+\([^)]*\))?\s+(\d+)(?:\.(\d+))?/i)
    ?? output.match(/\bgdb[^\d]*(\d+)(?:\.(\d+))?/i);
  if (!match) return undefined;
  return {
    major: Number(match[1]),
    ...(match[2] === undefined ? {} : { minor: Number(match[2]) }),
    raw: firstLine || match[0],
  };
}

function probeGdbVersion(command: string): GdbDapVersion {
  const result = spawnSync(command, ['--version'], {
    encoding: 'utf8',
    windowsHide: true,
    shell: false,
    timeout: 8_000,
    maxBuffer: 128 * 1024,
  });
  if (result.error || result.status !== 0) {
    throw new DapError(`Unable to execute GDB at ${command}: ${result.error?.message ?? result.stderr?.trim() ?? `exit ${String(result.status)}`}`);
  }
  const version = parseGdbVersion(`${result.stdout ?? ''}\n${result.stderr ?? ''}`);
  if (!version) throw new DapError(`Unable to parse GDB version from ${command}.`);
  if (version.major < MIN_GDB_DAP_MAJOR) {
    throw new DapError(`GDB ${version.major}${version.minor === undefined ? '' : `.${version.minor}`} is too old for the built-in DAP interpreter. GDB ${MIN_GDB_DAP_MAJOR}+ is required.`);
  }
  return version;
}

function resultFor(command: string, source: GdbDapDiscoverySource, searched: string[]): GdbDapDiscoveryResult {
  return {
    command,
    args: ['--interpreter=dap', '--quiet', '--nx'],
    source,
    searched,
    version: probeGdbVersion(command),
  };
}

export function discoverGdbDap(options: DiscoverGdbDapOptions = {}): GdbDapDiscoveryResult {
  const env = options.env ?? process.env;
  const searched: string[] = [];

  if (options.explicitPath) {
    const candidate = resolveExistingFile(options.explicitPath, 'GDB executable');
    searched.push(candidate);
    return resultFor(candidate, 'explicit', searched);
  }

  for (const key of ['GDB_DAP_PATH', 'GDB_PATH'] as const) {
    const raw = env[key];
    if (!raw) continue;
    const candidate = resolve(raw);
    searched.push(candidate);
    if (isFile(candidate)) return resultFor(candidate, 'environment', searched);
  }

  if (env.GDB_HOME) {
    const candidate = join(resolve(env.GDB_HOME), 'bin', process.platform === 'win32' ? 'gdb.exe' : 'gdb');
    searched.push(candidate);
    if (isFile(candidate)) return resultFor(candidate, 'home', searched);
  }

  if (options.allowPathFallback !== false) {
    for (const name of executableNames()) {
      searched.push(name);
      const candidate = findOnPath(name);
      if (candidate) return resultFor(candidate, 'path', searched);
    }
  }

  throw new DapError(
    `GDB with DAP support was not found. Install GDB ${MIN_GDB_DAP_MAJOR}+, set GDB_PATH/GDB_DAP_PATH/GDB_HOME, or pass adapterPath. Searched: ${searched.join(', ')}`,
  );
}

export function buildGdbDapLaunchConfiguration(options: GdbDapLaunchOptions): Record<string, unknown> {
  const program = resolveExistingFile(options.program, 'Program executable');
  const cwd = options.cwd
    ? resolveExistingDirectory(options.cwd, 'Working directory')
    : dirname(program);
  return {
    program,
    args: options.args ?? [],
    cwd,
    ...(options.env ? { env: options.env } : {}),
    stopOnEntry: options.stopOnEntry ?? false,
    ...(options.stopAtBeginningOfMainSubprogram === undefined
      ? {}
      : { stopAtBeginningOfMainSubprogram: options.stopAtBeginningOfMainSubprogram }),
  };
}

export function buildGdbDapPidAttachConfiguration(options: GdbDapPidAttachOptions): Record<string, unknown> {
  if (!Number.isSafeInteger(options.pid) || options.pid <= 0) {
    throw new DapError(`GDB attach PID must be a positive safe integer; received ${String(options.pid)}`);
  }
  return {
    pid: options.pid,
    ...(options.program ? { program: resolveExistingFile(options.program, 'Program image') } : {}),
  };
}

export function buildGdbDapRemoteAttachConfiguration(options: GdbDapRemoteAttachOptions): Record<string, unknown> {
  const target = options.target.trim();
  if (!target) throw new DapError('GDB remote target must not be empty.');
  return {
    target,
    ...(options.program ? { program: resolveExistingFile(options.program, 'Program image') } : {}),
  };
}

export function buildGdbDapCoreConfiguration(options: GdbDapCoreOptions): Record<string, unknown> {
  return {
    coreFile: resolveExistingFile(options.coreFile, 'Crash dump'),
    ...(options.program ? { program: resolveExistingFile(options.program, 'Program image') } : {}),
  };
}
''')

          write('src/tools/register-gdb-dap-tools.ts', r'''import type { McpServer } from '@modelcontextprotocol/server';
import * as z from 'zod/v4';

import {
  buildGdbDapLaunchConfiguration,
  buildGdbDapPidAttachConfiguration,
  buildGdbDapRemoteAttachConfiguration,
  discoverGdbDap,
} from '../adapters/gdb-dap.js';
import { GuardedDapSession } from '../dap/guarded-session.js';
import { LOCAL_TARGET_EXECUTION_ANNOTATIONS, READ_ONLY_LOCAL_TOOL_ANNOTATIONS } from './tool-annotations.js';

const breakpointGroupSchema = z.object({
  source: z.string().min(1).describe('Absolute or GDB-resolvable source file path.'),
  lines: z.array(z.number().int().positive()).min(1).describe('One or more 1-based source lines to set before configurationDone.'),
});

function result(value: unknown) {
  return { content: [{ type: 'text' as const, text: JSON.stringify(value, null, 2) }] };
}

function errorResult(error: unknown) {
  return { content: [{ type: 'text' as const, text: error instanceof Error ? error.message : String(error) }], isError: true };
}

function wrap<TArgs extends Record<string, unknown>>(handler: (args: TArgs) => Promise<unknown> | unknown) {
  return async (args: TArgs) => {
    try {
      return result(await handler(args));
    } catch (error) {
      return errorResult(error);
    }
  };
}

export function registerGdbDapTools(server: McpServer, session: GuardedDapSession): void {
  server.registerTool(
    'debug_gdb_info',
    {
      title: 'Locate GDB DAP',
      description: 'Locate and version-check a local GDB executable with the built-in DAP interpreter. Use this to verify GDB >= 14 discovery before starting a GNU debugger session; it only probes the local executable and does not launch or attach a debuggee.',
      annotations: READ_ONLY_LOCAL_TOOL_ANNOTATIONS,
      inputSchema: z.object({
        adapterPath: z.string().min(1).optional().describe('Optional explicit path to the GDB executable; omit to search GDB_DAP_PATH, GDB_PATH, GDB_HOME, and PATH.'),
      }),
    },
    wrap(async ({ adapterPath }) => discoverGdbDap({ ...(adapterPath ? { explicitPath: adapterPath as string } : {}) })),
  );

  server.registerTool(
    'debug_start_gdb',
    {
      title: 'Start GDB DAP',
      description: 'Discover GDB >= 14 and initialize its built-in Debug Adapter Protocol interpreter over stdio. Use this before the manual GDB launch/attach helpers in the full toolset; it starts only GDB itself and does not yet run or attach a target.',
      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,
      inputSchema: z.object({
        adapterPath: z.string().min(1).optional().describe('Optional explicit GDB executable path; omit to use normal GDB discovery.'),
        cwd: z.string().optional().describe('Working directory for the local GDB adapter process.'),
        requestTimeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Per-request DAP timeout in milliseconds.'),
      }),
    },
    wrap(async ({ adapterPath, cwd, requestTimeoutMs }) => {
      const adapter = discoverGdbDap({ ...(adapterPath ? { explicitPath: adapterPath as string } : {}) });
      const capabilities = await session.start({
        command: adapter.command,
        args: adapter.args,
        adapterId: 'gdb',
        ...(cwd ? { cwd: cwd as string } : {}),
        requestTimeoutMs: requestTimeoutMs as number,
      });
      return { adapter, capabilities, status: session.snapshot() };
    }),
  );

  server.registerTool(
    'debug_launch_gdb',
    {
      title: 'Launch with GDB DAP',
      description: 'Launch an authorized local native program through an initialized GDB DAP session. This executes application code and may produce normal target side effects; use debug_this_crash(mode="gdb") for the higher-level diagnose/verify workflow.',
      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,
      inputSchema: z.object({
        program: z.string().min(1).describe('Local native executable to launch.'),
        args: z.array(z.string()).optional().describe('Command-line arguments for the inferior.'),
        cwd: z.string().optional().describe('Working directory inherited by the inferior.'),
        env: z.record(z.string(), z.string()).optional().describe('Exact environment object passed to the GDB launch request.'),
        stopOnEntry: z.boolean().default(false).describe('Stop at the first instruction using GDB starti semantics.'),
        stopAtBeginningOfMainSubprogram: z.boolean().default(false).describe('Stop at the main subprogram using GDB start semantics.'),
        breakpoints: z.array(breakpointGroupSchema).optional().describe('Optional source breakpoints configured before the inferior runs.'),
      }),
    },
    wrap(async ({ program, args, cwd, env, stopOnEntry, stopAtBeginningOfMainSubprogram, breakpoints }) => session.launch(
      buildGdbDapLaunchConfiguration({
        program: program as string,
        ...(args ? { args: args as string[] } : {}),
        ...(cwd ? { cwd: cwd as string } : {}),
        ...(env ? { env: env as Record<string, string> } : {}),
        stopOnEntry: stopOnEntry as boolean,
        stopAtBeginningOfMainSubprogram: stopAtBeginningOfMainSubprogram as boolean,
      }),
      (breakpoints ?? []) as Array<{ source: string; lines: number[] }>,
    )),
  );

  server.registerTool(
    'debug_attach_gdb',
    {
      title: 'Attach GDB to PID',
      description: 'Attach an initialized GDB DAP session to an authorized local process by PID. This changes debugger/target state and can stop the process; use only for targets you are authorized to inspect.',
      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,
      inputSchema: z.object({
        pid: z.number().int().positive().describe('Authorized local process ID to attach.'),
        program: z.string().min(1).optional().describe('Optional matching executable image used for symbols when GDB cannot infer it.'),
        breakpoints: z.array(breakpointGroupSchema).optional().describe('Optional source breakpoints configured before attach setup completes.'),
      }),
    },
    wrap(async ({ pid, program, breakpoints }) => session.attach(
      buildGdbDapPidAttachConfiguration({ pid: pid as number, ...(program ? { program: program as string } : {}) }),
      (breakpoints ?? []) as Array<{ source: string; lines: number[] }>,
    )),
  );

  server.registerTool(
    'debug_attach_gdb_remote',
    {
      title: 'Attach GDB Remote Target',
      description: 'Connect an initialized GDB DAP session to an explicitly authorized target-remote endpoint such as localhost:1234. This opens a debugger connection to the supplied endpoint and can control the remote target; it never starts gdbserver itself.',
      annotations: LOCAL_TARGET_EXECUTION_ANNOTATIONS,
      inputSchema: z.object({
        target: z.string().min(1).describe('GDB target remote argument, for example localhost:1234 or a local debug socket.'),
        program: z.string().min(1).optional().describe('Optional local unstripped executable used for matching symbols.'),
        breakpoints: z.array(breakpointGroupSchema).optional().describe('Optional source breakpoints configured after connecting.'),
      }),
    },
    wrap(async ({ target, program, breakpoints }) => session.attach(
      buildGdbDapRemoteAttachConfiguration({ target: target as string, ...(program ? { program: program as string } : {}) }),
      (breakpoints ?? []) as Array<{ source: string; lines: number[] }>,
    )),
  );
}
''')

          write('src/tools/find-writer.ts', r'''import type { McpServer } from '@modelcontextprotocol/server';
import type { DebugProtocol } from '@vscode/debugprotocol';
import * as z from 'zod/v4';

import { correlateSourceDisassembly } from '../diagnostics/analyze-snapshot.js';
import { DapError } from '../dap/errors.js';
import { GuardedDapSession } from '../dap/guarded-session.js';
import type { RuntimeSnapshotOptions } from '../dap/session.js';
import { DEBUG_SESSION_CONTROL_ANNOTATIONS } from './tool-annotations.js';

export type FindWriterOptions = {
  name: string;
  variablesReference?: number;
  frameId?: number;
  accessType?: 'read' | 'write' | 'readWrite';
  condition?: string;
  hitCondition?: string;
  threadId?: number;
  timeoutMs?: number;
  replaceExistingDataBreakpoints?: boolean;
  snapshot?: RuntimeSnapshotOptions;
};

type ResumeOutcome = {
  event: 'stopped' | 'exited' | 'terminated';
  body?: unknown;
};

function isDataBreakpointStop(body: unknown): boolean {
  const stopped = body as { reason?: unknown; description?: unknown; text?: unknown } | undefined;
  const text = [stopped?.reason, stopped?.description, stopped?.text]
    .filter((value): value is string => typeof value === 'string')
    .join(' ')
    .toLowerCase();
  return /data\s*breakpoint|watchpoint/.test(text);
}

async function continueToOutcome(session: GuardedDapSession, threadId: number, timeoutMs: number): Promise<ResumeOutcome> {
  const outcome = Promise.any([
    session.connection.waitForEvent('stopped', timeoutMs).then((event) => ({ event: 'stopped' as const, body: event.body })),
    session.connection.waitForEvent('exited', timeoutMs).then((event) => ({ event: 'exited' as const, body: event.body })),
    session.connection.waitForEvent('terminated', timeoutMs).then((event) => ({ event: 'terminated' as const, body: event.body })),
  ]);
  await session.continueExecution(threadId, false, timeoutMs);
  return outcome;
}

async function restoreDataBreakpoints(
  session: GuardedDapSession,
  previous: DebugProtocol.DataBreakpoint[],
): Promise<string | undefined> {
  try {
    await session.setDataBreakpoints(previous);
    return undefined;
  } catch (error) {
    return error instanceof Error ? error.message : String(error);
  }
}

export async function findWriter(session: GuardedDapSession, options: FindWriterOptions) {
  return session.runExclusiveLifecycle('find writer', async () => {
    if (session.isPostmortem()) {
      throw new DapError('debug_find_writer requires a live stopped target; a crash dump is frozen and cannot trigger a data breakpoint.');
    }

    const timeoutMs = options.timeoutMs ?? 30_000;
    const snapshotOptions: RuntimeSnapshotOptions = {
      ...(options.snapshot ?? {}),
      ...(options.threadId === undefined ? {} : { threadId: options.threadId }),
      includeDisassembly: options.snapshot?.includeDisassembly ?? true,
      includeModules: options.snapshot?.includeModules ?? false,
      includeExceptionInfo: options.snapshot?.includeExceptionInfo ?? true,
    };
    const before = await session.runtimeSnapshot(snapshotOptions);
    const selectedThreadId = options.threadId ?? before.thread.id;
    const frameId = options.frameId ?? before.frame.id;

    const resolution = await session.dataBreakpointInfo(
      options.name,
      options.variablesReference,
      options.variablesReference === undefined ? frameId : undefined,
    );
    if (!resolution.dataId) {
      throw new DapError(`The active debugger cannot create a data breakpoint for '${options.name}': ${resolution.description}`);
    }

    const requestedAccess = options.accessType ?? 'write';
    if (resolution.accessTypes?.length && !resolution.accessTypes.includes(requestedAccess)) {
      throw new DapError(
        `The active debugger does not support accessType='${requestedAccess}' for '${options.name}'. Supported: ${resolution.accessTypes.join(', ')}`,
      );
    }

    const previous = session.dataBreakpointConfiguration();
    const writerBreakpoint: DebugProtocol.DataBreakpoint = {
      dataId: resolution.dataId,
      accessType: requestedAccess,
      ...(options.condition ? { condition: options.condition } : {}),
      ...(options.hitCondition ? { hitCondition: options.hitCondition } : {}),
    };
    const requestedBreakpoints = options.replaceExistingDataBreakpoints
      ? [writerBreakpoint]
      : [...previous, writerBreakpoint];
    const installed = await session.setDataBreakpoints(requestedBreakpoints);

    let outcome: ResumeOutcome;
    try {
      outcome = await continueToOutcome(session, selectedThreadId, timeoutMs);
    } catch (error) {
      try {
        await session.pause(selectedThreadId, true, Math.min(timeoutMs, 5_000));
      } catch {
        // The target may already have exited or the adapter may no longer be resumable.
      }
      const restoreWarning = await restoreDataBreakpoints(session, previous);
      if (restoreWarning) {
        throw new DapError(`${error instanceof Error ? error.message : String(error)}; additionally failed to restore prior data breakpoints: ${restoreWarning}`);
      }
      throw error;
    }

    let after;
    if (outcome.event === 'stopped') {
      after = await session.runtimeSnapshot({ ...snapshotOptions, threadId: selectedThreadId });
    }
    const restoreWarning = await restoreDataBreakpoints(session, previous);
    const hitConfirmed = outcome.event === 'stopped' && isDataBreakpointStop(outcome.body);

    return {
      query: {
        name: options.name,
        accessType: requestedAccess,
        ...(options.variablesReference === undefined ? {} : { variablesReference: options.variablesReference }),
        frameId,
      },
      resolution,
      priorDataBreakpointCount: previous.length,
      replaceExistingDataBreakpoints: options.replaceExistingDataBreakpoints ?? false,
      installed,
      outcome,
      hitConfirmed,
      before: {
        thread: before.thread,
        frame: before.frame,
      },
      ...(after
        ? {
            writerFrame: hitConfirmed ? after.frame : undefined,
            writerCorrelation: hitConfirmed ? correlateSourceDisassembly(after) : undefined,
            snapshot: after,
          }
        : {}),
      ...(restoreWarning ? { restoreWarning } : {}),
      guidance: hitConfirmed
        ? 'The debugger reported a data-breakpoint/watchpoint stop. The top frame is the immediate writer candidate; inspect its source and callers before making a causal claim.'
        : outcome.event === 'stopped'
          ? 'Execution stopped for another reason before the watched write. Inspect this stop; call debug_find_writer again only if it is safe to continue the reproduction.'
          : 'The target exited or terminated before the watched write was observed.',
      status: session.snapshot(),
    };
  });
}

function result(value: unknown) {
  return { content: [{ type: 'text' as const, text: JSON.stringify(value, null, 2) }] };
}

function errorResult(error: unknown) {
  return { content: [{ type: 'text' as const, text: error instanceof Error ? error.message : String(error) }], isError: true };
}

export function registerFindWriterTool(server: McpServer, session: GuardedDapSession): void {
  server.registerTool(
    'debug_find_writer',
    {
      title: 'Find Runtime Writer',
      description: 'Set a temporary DAP data breakpoint/watchpoint on a variable or expression, resume an authorized live target, and capture the first resulting stop to identify the immediate writer candidate. Use this after a stopped-state diagnosis suggests a value was corrupted and you need runtime provenance; do not use it for crash dumps or when resuming the program is unsafe. The tool preserves data breakpoints previously configured through this MCP session, restores them afterward, and never automatically continues through an unrelated breakpoint, exception, or signal stop.',
      annotations: DEBUG_SESSION_CONTROL_ANNOTATIONS,
      inputSchema: z.object({
        name: z.string().min(1).describe('Variable child name or debugger expression to watch. Without variablesReference, the expression is resolved in frameId/current frame when supported.'),
        variablesReference: z.number().int().positive().optional().describe('Optional DAP variable-container reference when watching a named child; obtain it from the current stopped state.'),
        frameId: z.number().int().positive().optional().describe('Optional stopped frame used to resolve an expression; omit to use the current snapshot frame. Ignored when variablesReference is supplied.'),
        accessType: z.enum(['read', 'write', 'readWrite']).default('write').describe('Requested watchpoint access mode. write is the normal choice when finding who corrupts a value.'),
        condition: z.string().min(1).optional().describe('Optional adapter-supported condition applied to the temporary data breakpoint.'),
        hitCondition: z.string().min(1).optional().describe('Optional adapter-supported hit-count condition for the temporary data breakpoint.'),
        threadId: z.number().int().positive().optional().describe('Stopped thread to resume and inspect; omit to use the debugger-selected stopped thread.'),
        timeoutMs: z.number().int().min(1000).max(120000).default(30000).describe('Maximum time in milliseconds to wait for a stop, exit, or termination after resuming.'),
        replaceExistingDataBreakpoints: z.boolean().default(false).describe('When false, preserve existing MCP-configured data breakpoints alongside the temporary writer watch; when true, temporarily replace them for a cleaner reproduction.'),
        snapshot: z.object({
          stackLevels: z.number().int().positive().max(100).default(12).describe('Maximum stack frames captured at the writer stop.'),
          maxVariablesPerScope: z.number().int().positive().max(500).default(100).describe('Maximum variables captured per scope at the writer stop.'),
          includeDisassembly: z.boolean().default(true).describe('Include nearby instructions at the writer stop when supported.'),
          disassembleBefore: z.number().int().nonnegative().max(100).default(8).describe('Instructions requested before the writer instruction.'),
          disassembleAfter: z.number().int().nonnegative().max(100).default(12).describe('Instructions requested after the writer instruction.'),
          includeModules: z.boolean().default(false).describe('Include a bounded module list at the writer stop.'),
          moduleCount: z.number().int().positive().max(500).default(50).describe('Maximum modules returned when module collection is enabled.'),
          includeExceptionInfo: z.boolean().default(true).describe('Collect exception information if the resulting stop is an exception rather than the expected watchpoint.'),
        }).optional().describe('Bounds for the evidence snapshot captured after execution stops.'),
      }),
    },
    async (options) => {
      try {
        return result(await findWriter(session, options as FindWriterOptions));
      } catch (error) {
        return errorResult(error);
      }
    },
  );
}
''')

          write('test/gdb-dap-profile.test.ts', r'''import assert from 'node:assert/strict';
import { mkdtempSync, writeFileSync } from 'node:fs';
import { tmpdir } from 'node:os';
import { join } from 'node:path';
import test from 'node:test';

import {
  buildGdbDapCoreConfiguration,
  buildGdbDapLaunchConfiguration,
  buildGdbDapPidAttachConfiguration,
  buildGdbDapRemoteAttachConfiguration,
  parseGdbVersion,
} from '../src/adapters/gdb-dap.js';

function fixtureFile(name: string): string {
  const dir = mkdtempSync(join(tmpdir(), 'qwen-gdb-dap-'));
  const path = join(dir, name);
  writeFileSync(path, 'fixture');
  return path;
}

test('parseGdbVersion accepts release and distro version strings', () => {
  assert.deepEqual(parseGdbVersion('GNU gdb (GDB) 17.2\n'), { major: 17, minor: 2, raw: 'GNU gdb (GDB) 17.2' });
  assert.equal(parseGdbVersion('GNU gdb (Ubuntu 15.0.50.20240403-0ubuntu1) 15.0.50\n')?.major, 15);
  assert.equal(parseGdbVersion('not gdb'), undefined);
});

