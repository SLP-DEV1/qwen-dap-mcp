  assert.deepEqual(buildGdbDapRemoteAttachConfiguration({ target: 'localhost:1234', program }), { target: 'localhost:1234', program });
  assert.deepEqual(buildGdbDapCoreConfiguration({ coreFile, program }), { coreFile, program });
});
''')

