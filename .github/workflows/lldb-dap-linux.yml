name: lldb-dap Linux Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/adapters/lldb-dap.ts'
      - 'src/dap/**'
      - 'src/remote-endpoint.ts'
      - 'src/tools/agent-diagnostics.ts'
      - 'src/tools/register-dump-tools.ts'
      - 'src/tools/register-lldb-dap-tools.ts'
      - 'test/lldb-dap-*.ts'
      - 'test/lldb-server-real-smoke.ts'
      - 'test/fixtures/native-smoke.cpp'
      - 'test/fixtures/lldb-dap-crash.cpp'
      - '.github/workflows/lldb-dap-linux.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/adapters/lldb-dap.ts'
      - 'src/dap/**'
      - 'src/remote-endpoint.ts'
      - 'src/tools/agent-diagnostics.ts'
      - 'src/tools/register-dump-tools.ts'
      - 'src/tools/register-lldb-dap-tools.ts'
      - 'test/lldb-dap-*.ts'
      - 'test/lldb-server-real-smoke.ts'
      - 'test/fixtures/native-smoke.cpp'
      - 'test/fixtures/lldb-dap-crash.cpp'
      - '.github/workflows/lldb-dap-linux.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install distribution LLDB
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lldb

      - name: Show installed lldb-dap and lldb-server layout
        shell: bash
        run: |
          adapter="$(command -v lldb-dap || true)"
          if [ -z "$adapter" ]; then
            adapter="$(find /usr/lib -maxdepth 4 -type f -name 'lldb-dap' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          server="$(command -v lldb-server || true)"
          if [ -z "$server" ]; then
            server="$(find /usr/lib -maxdepth 4 -type f -name 'lldb-server' -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$adapter"
          test -x "$adapter"
          test -n "$server"
          test -x "$server"
          echo "Installed lldb-dap: $adapter"
          echo "Installed lldb-server: $server"
          echo "LLDB_DAP_PATH=$adapter" >> "$GITHUB_ENV"
          echo "LLDB_SERVER_PATH=$server" >> "$GITHUB_ENV"

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Build project and native fixtures
        run: |
          npm run build
          mkdir -p build/lldb-dap-smoke
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/native-smoke.cpp -o build/lldb-dap-smoke/native-smoke
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/lldb-dap-crash.cpp -o build/lldb-dap-smoke/lldb-dap-crash

      - name: Run real lldb-dap launch smoke through auto-discovery
        run: |
          npx tsx test/lldb-dap-real-smoke.ts \
            --adapter "$LLDB_DAP_PATH" \
            --program build/lldb-dap-smoke/native-smoke \
            --source test/fixtures/native-smoke.cpp

      - name: Run high-level debug_this_crash lldb-dap smoke
        run: |
          npx tsx test/lldb-dap-high-level-smoke.ts \
            --adapter "$LLDB_DAP_PATH" \
            --program build/lldb-dap-smoke/lldb-dap-crash \
            --source test/fixtures/lldb-dap-crash.cpp

      - name: Run real lldb-server remote attach smoke
        run: |
          env -u QWEN_DAP_MCP_REMOTE_DEBUG_HOSTS npx tsx test/lldb-server-real-smoke.ts \
            --adapter "$LLDB_DAP_PATH" \
            --server "$LLDB_SERVER_PATH" \
            --program build/lldb-dap-smoke/native-smoke \
            --source test/fixtures/native-smoke.cpp
