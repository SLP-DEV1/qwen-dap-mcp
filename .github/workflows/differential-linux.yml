name: Differential Runtime Linux Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/diagnostics/runtime-diff.ts'
      - 'src/dap/**'
      - 'src/tools/register-differential-tools.ts'
      - 'src/tools/value-tracing.ts'
      - 'test/differential-gdb-real-smoke.ts'
      - 'test/runtime-diff.test.ts'
      - 'test/operation-context.test.ts'
      - 'test/value-tracing.test.ts'
      - 'test/fixtures/differential-smoke.cpp'
      - '.github/workflows/differential-linux.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/diagnostics/runtime-diff.ts'
      - 'src/dap/**'
      - 'src/tools/register-differential-tools.ts'
      - 'src/tools/value-tracing.ts'
      - 'test/differential-gdb-real-smoke.ts'
      - 'test/runtime-diff.test.ts'
      - 'test/operation-context.test.ts'
      - 'test/value-tracing.test.ts'
      - 'test/fixtures/differential-smoke.cpp'
      - '.github/workflows/differential-linux.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  gdb-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install GDB toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb g++
          gdb --version

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Build project and differential fixture
        run: |
          npm run build
          mkdir -p build/differential-smoke
          g++ -std=c++17 -g3 -O0 -fno-omit-frame-pointer test/fixtures/differential-smoke.cpp -o build/differential-smoke/differential-smoke

      - name: Compare real good and bad GDB DAP sessions
        run: |
          env -u GDB_DAP_PATH -u GDB_PATH -u GDB_HOME \
            npx tsx test/differential-gdb-real-smoke.ts \
            --program build/differential-smoke/differential-smoke \
            --source test/fixtures/differential-smoke.cpp
