name: Apply v0.13 README update

on:
  push:
    branches:
      - feature/v0.13-lldb-dap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.13-lldb-dap
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update README for lldb-dap
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'README.md';
          let text = fs.readFileSync(path, 'utf8');

          function replaceOnce(from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`Missing README anchor: ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`Non-unique README anchor: ${label}`);
            text = text.slice(0, first) + to + text.slice(first + from.length);
          }

          replaceOnce(
            '- **CodeLLDB integration** — launch or attach to authorized local native targets through DAP.\n',
            '- **CodeLLDB integration** — launch or attach to authorized local native targets through DAP.\n- **Upstream LLVM lldb-dap integration** — first-class live debugging and core-file inspection without treating lldb-dap as a CodeLLDB alias.\n',
            'capability bullet',
          );

          replaceOnce(
            'starts CodeLLDB through qwen-dap-mcp',
            'starts CodeLLDB or upstream lldb-dap through qwen-dap-mcp',
            '30-second adapter line',
          );

          replaceOnce(
            '## Autonomous crash debugging\n',
            `## Debugger adapters\n\nCodeLLDB and upstream LLVM \`lldb-dap\` are both first-class adapter paths. Existing CodeLLDB workflows remain supported; use \`debug_this_crash(mode="lldb-dap")\` when you want the debugger adapter shipped by LLVM itself. The \`lldb-dap\` path supports live launch/attach plus read-only core-file analysis through \`dumpAdapter="lldb-dap"\`.\n\nDiscovery supports an explicit \`adapterPath\`, \`LLDB_DAP_PATH\`, canonical or versioned PATH binaries, common LLVM toolchain directories / \`LLVM_HOME\`, and \`xcrun --find lldb-dap\` on macOS. See [docs/lldb-dap.md](docs/lldb-dap.md) for examples, postmortem behavior, and the manual full-toolset helpers.\n\n## Autonomous crash debugging\n`,
            'adapter section',
          );

          replaceOnce(
            ' CodeLLDB / DAP adapter',
            ' CodeLLDB / lldb-dap / DAP adapter',
            'architecture adapter label',
          );

          replaceOnce(
            '| `debug_this_crash` | High-level live/CodeLLDB/dump diagnosis, verification, and autonomous orchestration |',
            '| `debug_this_crash` | High-level live/CodeLLDB/lldb-dap/dump diagnosis, verification, and autonomous orchestration |',
            'agent tool row',
          );

          replaceOnce(
            'and CodeLLDB lifecycle primitives.',
            'and CodeLLDB / lldb-dap lifecycle primitives.',
            'full toolset description',
          );

          fs.writeFileSync(path, text);
          NODE

          npm ci --ignore-scripts
          npm run check

      - name: Commit tested README
        shell: bash
        run: |
          git add README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: document upstream lldb-dap support'
          git push origin HEAD:feature/v0.13-lldb-dap
