name: Issue 44 hardening fix

on:
  push:
    branches:
      - feature/v0.14-gdb-find-writer
    paths:
      - '.github/workflows/issue44-hardening-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v0.14-gdb-find-writer
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed patch
        run: node .github/scripts/issue44-fix.mjs

      - name: Validate project
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Commit validated fix
        run: |
          rm .github/workflows/issue44-hardening-fix.yml
          rm .github/scripts/issue44-fix.mjs
          git config user.name "SLP-DEV1"
          git config user.email "aufgeklebt@outlook.de"
          git add -A
          git commit -m "fix: harden DAP lifecycle and validation for issue 44"
          git push origin HEAD:feature/v0.14-gdb-find-writer
